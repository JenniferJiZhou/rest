name: HTTPS Staging Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the immutable SHA tag to GHCR
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/publish-staging-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "server/**"
      - "content/rest-quests.json"
      - "contracts/fixtures/mail-items-demo.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-staging-image.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "server/**"
      - "content/rest-quests.json"
      - "contracts/fixtures/mail-items-demo.json"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: staging-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/hush-server-staging" >> "$GITHUB_OUTPUT"

      - name: Build immutable staging image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke container health
        shell: bash
        run: |
          container_name="hush-server-image-smoke"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:3000:3000 \
            --env NODE_ENV=production \
            --env PUBLIC_BASE_URL=https://hush-server-staging.example.com \
            --env TRUST_PROXY=true \
            --env HUSH_REST_DECISION_PROVIDER=canned \
            --env HUSH_DEMO_MODE=false \
            --env HUSH_APP_TOKEN=ci-health-smoke-app-token-00000001 \
            --env HUSH_CONNECTOR_TOKEN=ci-health-smoke-connector-token-00000002 \
            --env LOG_LEVEL=silent \
            "${{ steps.image.outputs.name }}:$GITHUB_SHA"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

  publish:
    needs: build
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish immutable staging image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ needs.build.outputs.image_name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish moving main tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          image="${{ needs.build.outputs.image_name }}"
          docker buildx imagetools create \
            --tag "$image:main" \
            "$image:$GITHUB_SHA"
