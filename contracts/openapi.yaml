openapi: 3.1.0
info:
  title: Hush API
  version: 1.1.0
  description: >
    Contract for Hush Apple clients, Agent backend, Gmail handoff, and Photon adapter.
    Contract 1.0 keeps canonical fixed Quest content. Contract 1.1 Rest
    evaluate can return a StepFun-generated structured rest task.
servers:
  - url: http://localhost:3000
    description: Local protocol smoke; HTTPS staging pending
tags:
  - name: Health
  - name: Rest
  - name: Handoff
  - name: Inbox
  - name: Gmail
  - name: Photon

paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                type: object
                required: [status, contract_version]
                properties:
                  status: { type: string, const: ok }
                  contract_version: { type: string, const: "1.0" }
                  providers:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ready, degraded, unavailable, unknown]

  /v1/rest/evaluate:
    post:
      tags: [Rest]
      operationId: evaluateRest
      description: >
        Evaluates exactly one current iOS App, current Mac App, current Mac
        website, or legacy UsageSummary. Current and legacy usage fields must
        not be combined. The server only offers a choice; it never controls
        Shield state or changes the next usage threshold. request_id is also
        the idempotency key for this checkpoint: an identical retry returns
        the stored decision, while reuse with different content returns 409.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/RestContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/usage-summary.schema.json"
      responses:
        "200":
          description: Rest suggestion
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/RestContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/rest-suggestion.schema.json"
        "400":
          $ref: "#/components/responses/RestContractError"
        "409":
          $ref: "#/components/responses/RestContractError"
        "503":
          $ref: "#/components/responses/RestContractError"

  /v1/rest/check-in:
    post:
      tags: [Rest]
      operationId: reflectFatigue
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/fatigue-check-in.schema.json"
      responses:
        "200":
          description: Fatigue reflection; at most one follow-up
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/fatigue-reflection.schema.json"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/rest/recommend:
    post:
      tags: [Rest]
      operationId: recommendRest
      description: >
        Contract 1.0 selects a Quest from fixed content for legacy clients.
        Contract 1.1 generates one manual rest task after the user has
        already chosen to rest. request_id is the idempotency key: an
        identical retry returns the stored result, while reuse with
        different content returns 409.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/RestContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/rest-recommendation.schema.json#/$defs/RestRecommendationRequest"
            examples:
              dynamic:
                externalValue: "./fixtures/rest-recommendation-dynamic-request.json"
      responses:
        "200":
          description: Legacy fixed Quest or Contract 1.1 generated task
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/RestContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/rest-recommendation.schema.json#/$defs/RestRecommendation"
              examples:
                legacy:
                  externalValue: "./fixtures/rest-recommendation-success.json"
                dynamic:
                  externalValue: "./fixtures/rest-recommendation-dynamic-success.json"
        "400":
          $ref: "#/components/responses/RestContractError"
        "409":
          $ref: "#/components/responses/RestContractError"
        "503":
          $ref: "#/components/responses/RestContractError"

  /v1/rest/feedback:
    post:
      tags: [Rest]
      operationId: recordRestFeedback
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/rest-feedback.schema.json"
      responses:
        "202":
          description: Accepted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/handoff/start:
    post:
      tags: [Handoff]
      operationId: startHandoff
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/handoff-start-request.schema.json"
      responses:
        "202":
          description: Handoff job created or existing idempotent job returned
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/handoff-job.schema.json#/$defs/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/handoff/{jobId}:
    get:
      tags: [Handoff]
      operationId: getHandoffJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      responses:
        "200":
          description: Current state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/handoff-job.schema.json#/$defs/HandoffJobState"
        "404":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/handoff/{jobId}/cancel:
    post:
      tags: [Handoff]
      operationId: cancelHandoff
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      responses:
        "202":
          description: Cancellation requested
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
        "404":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/items:
    get:
      tags: [Inbox]
      operationId: listUnifiedInboxItems
      description: Lists provider-neutral Unified Inbox items in stable received_at descending order.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: source
          in: query
          schema:
            $ref: "./schemas/unified-inbox.schema.json#/$defs/Source"
        - name: status
          in: query
          schema:
            $ref: "./schemas/unified-inbox.schema.json#/$defs/ItemStatus"
        - name: needs_reply
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Stable filtered Inbox page
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/ListResponse"
              examples:
                mock:
                  externalValue: "./fixtures/unified-inbox-items.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/items/{itemId}:
    get:
      tags: [Inbox]
      operationId: getUnifiedInboxItem
      parameters:
        - $ref: "#/components/parameters/InboxItemId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      responses:
        "200":
          description: Provider-neutral Inbox item detail
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/ItemResponse"
              examples:
                mock:
                  externalValue: "./fixtures/unified-inbox-item-detail.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/items/{itemId}:acknowledge:
    post:
      tags: [Inbox]
      operationId: acknowledgeUnifiedInboxItem
      parameters:
        - $ref: "#/components/parameters/InboxItemId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/unified-inbox.schema.json#/$defs/AcknowledgeRequest"
            example:
              schema_version: "1.0"
              request_id: req_inbox_ack
      responses:
        "200":
          description: Idempotently acknowledged item
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/ItemResponse"
              examples:
                acknowledged:
                  externalValue: "./fixtures/unified-inbox-item-acknowledged.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/drafts/{draftId}:
    get:
      tags: [Inbox]
      operationId: getUnifiedInboxDraft
      parameters:
        - $ref: "#/components/parameters/InboxDraftId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      responses:
        "200":
          description: Current Inbox draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/DraftResponse"
              examples:
                editable:
                  externalValue: "./fixtures/unified-inbox-draft-editable.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Inbox]
      operationId: updateUnifiedInboxDraft
      parameters:
        - $ref: "#/components/parameters/InboxDraftId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/unified-inbox.schema.json#/$defs/PatchDraftRequest"
            example:
              schema_version: "1.0"
              request_id: req_inbox_patch
              operation: update_body
              expected_version: 1
              body: Thanks. I will review the mock document.
      responses:
        "200":
          description: Updated or discarded Inbox draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/DraftResponse"
              examples:
                updated:
                  externalValue: "./fixtures/unified-inbox-draft-editable.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/drafts/{draftId}/confirmation:
    post:
      tags: [Inbox]
      operationId: createUnifiedInboxConfirmation
      parameters:
        - $ref: "#/components/parameters/InboxDraftId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/unified-inbox.schema.json#/$defs/ConfirmationRequest"
            example:
              schema_version: "1.0"
              request_id: req_inbox_confirmation
              expected_version: 2
      responses:
        "201":
          description: Short-lived confirmation bound to the current draft version
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/ConfirmationResponse"
              examples:
                mock:
                  externalValue: "./fixtures/unified-inbox-confirmation.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/drafts/{draftId}:send:
    post:
      tags: [Inbox]
      operationId: sendUnifiedInboxDraft
      parameters:
        - $ref: "#/components/parameters/InboxDraftId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/unified-inbox.schema.json#/$defs/SendRequest"
            example:
              schema_version: "1.0"
              request_id: req_inbox_send
              confirmation_id: confirmation_mock_001
              expected_version: 2
      responses:
        "200":
          description: Simulated or future real delivery result
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/unified-inbox.schema.json#/$defs/SendResponse"
              examples:
                simulated:
                  externalValue: "./fixtures/unified-inbox-send-simulated.json"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/gmail/start:
    get:
      tags: [Gmail]
      operationId: startGmailOAuth
      parameters:
        - name: return_to
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to Google OAuth

  /v1/auth/gmail/callback:
    get:
      tags: [Gmail]
      operationId: gmailOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to app or success page

  /v1/auth/gmail/status:
    get:
      tags: [Gmail]
      operationId: getGmailStatus
      responses:
        "200":
          description: Gmail connection status
          content:
            application/json:
              schema:
                type: object
                required: [connected]
                properties:
                  connected: { type: boolean }
                  account_label: { type: [string, "null"] }
                  scopes:
                    type: array
                    items: { type: string }

  /v1/auth/gmail/disconnect:
    post:
      tags: [Gmail]
      operationId: disconnectGmail
      responses:
        "204":
          description: Disconnected

  /v1/webhooks/photon:
    post:
      tags: [Photon]
      operationId: receivePhotonWebhook
      description: >
        Provider payload is isolated in the Photon adapter. Exact payload schema must be frozen
        after Day-1 verification; business code must not consume the raw provider shape.
      parameters:
        - name: X-Photon-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Accepted
        "401":
          description: Invalid signature

components:
  parameters:
    InboxItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    InboxDraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: Must equal request_id in JSON request bodies.
      schema:
        type: string
        minLength: 1
    ClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ContractVersion:
      name: X-Contract-Version
      in: header
      required: true
      schema:
        type: string
        const: "1.0"
    RestContractVersion:
      name: X-Contract-Version
      in: header
      required: true
      description: >
        Rest evaluate and recommend support legacy fixed-Quest Contract 1.0
        and dynamic generated-task Contract 1.1.
      schema:
        type: string
        enum: ["1.0", "1.1"]
    DemoToken:
      name: X-Hush-Demo-Token
      in: header
      required: false
      description: Enables Sample Mode only when the server also has HUSH_DEMO_MODE=true.
      schema:
        type: string
        minLength: 8
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$'

  headers:
    RequestId:
      schema:
        type: string
    ContractVersion:
      schema:
        type: string
        const: "1.0"
    RestContractVersion:
      schema:
        type: string
        enum: ["1.0", "1.1"]
    DataOrigin:
      schema:
        type: string
        enum: [real, mock, cached]

  responses:
    RestContractError:
      description: Versioned Rest operation error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        X-Contract-Version:
          $ref: "#/components/headers/RestContractVersion"
        X-Hush-Data-Origin:
          $ref: "#/components/headers/DataOrigin"
      content:
        application/json:
          schema:
            $ref: "./schemas/error-response.schema.json"
    Error:
      description: Error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersion"
        X-Hush-Data-Origin:
          $ref: "#/components/headers/DataOrigin"
      content:
        application/json:
          schema:
            $ref: "./schemas/error-response.schema.json"
