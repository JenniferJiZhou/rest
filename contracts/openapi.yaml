openapi: 3.1.0
info:
  title: Hush API
  version: 1.1.0
  description: >
    Contract for Hush Apple clients, Agent backend, and Unified Inbox.
    Contract 1.0 keeps canonical fixed Quest content. Contract 1.1 Rest
    evaluate can return a StepFun-generated structured rest task.
servers:
  - url: http://localhost:3000
    description: Local protocol smoke; HTTPS staging pending
tags:
  - name: Health
  - name: Rest
  - name: Handoff
  - name: Inbox
  - name: Gmail
  - name: Photon

paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                type: object
                required: [status, contract_version]
                properties:
                  status: { type: string, const: ok }
                  contract_version: { type: string, const: "1.0" }
                  providers:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ready, degraded, unavailable, unknown]

  /v1/rest/evaluate:
    post:
      tags: [Rest]
      operationId: evaluateRest
      description: >
        Evaluates exactly one current iOS App, current Mac App, current Mac
        website, or legacy UsageSummary. Current and legacy usage fields must
        not be combined. The server only offers a choice; it never controls
        Shield state or changes the next usage threshold. request_id is also
        the idempotency key for this checkpoint: an identical retry returns
        the stored decision, while reuse with different content returns 409.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/RestContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/usage-summary.schema.json"
      responses:
        "200":
          description: Rest suggestion
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/RestContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/rest-suggestion.schema.json"
        "400":
          $ref: "#/components/responses/RestContractError"
        "409":
          $ref: "#/components/responses/RestContractError"
        "503":
          $ref: "#/components/responses/RestContractError"

  /v1/rest/check-in:
    post:
      tags: [Rest]
      operationId: reflectFatigue
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/fatigue-check-in.schema.json"
      responses:
        "200":
          description: Fatigue reflection; at most one follow-up
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/fatigue-reflection.schema.json"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/rest/recommend:
    post:
      tags: [Rest]
      operationId: recommendRest
      description: >
        Contract 1.0 selects a Quest from fixed content for legacy clients.
        Contract 1.1 generates one manual rest task after the user has
        already chosen to rest. request_id is the idempotency key: an
        identical retry returns the stored result, while reuse with
        different content returns 409.
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/RestContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/rest-recommendation.schema.json#/$defs/RestRecommendationRequest"
            examples:
              dynamic:
                externalValue: "./fixtures/rest-recommendation-dynamic-request.json"
      responses:
        "200":
          description: Legacy fixed Quest or Contract 1.1 generated task
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/RestContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/rest-recommendation.schema.json#/$defs/RestRecommendation"
              examples:
                legacy:
                  externalValue: "./fixtures/rest-recommendation-success.json"
                dynamic:
                  externalValue: "./fixtures/rest-recommendation-dynamic-success.json"
        "400":
          $ref: "#/components/responses/RestContractError"
        "409":
          $ref: "#/components/responses/RestContractError"
        "503":
          $ref: "#/components/responses/RestContractError"

  /v1/rest/feedback:
    post:
      tags: [Rest]
      operationId: recordRestFeedback
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/rest-feedback.schema.json"
      responses:
        "202":
          description: Accepted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/handoff/start:
    post:
      tags: [Handoff]
      operationId: startHandoff
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/handoff-start-request.schema.json"
      responses:
        "202":
          description: Handoff job created or existing idempotent job returned
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/handoff-job.schema.json#/$defs/HandoffJob"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/handoff/{jobId}:
    get:
      tags: [Handoff]
      operationId: getHandoffJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      responses:
        "200":
          description: Current state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/handoff-job.schema.json#/$defs/HandoffJobState"
        "404":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/handoff/{jobId}/cancel:
    post:
      tags: [Handoff]
      operationId: cancelHandoff
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      responses:
        "202":
          description: Cancellation requested
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
        "404":
          $ref: "#/components/responses/Error"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/events:batch:
    post:
      tags: [Inbox]
      operationId: ingestInboxEvents
      security:
        - ConnectorBearer: []
        - DemoTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/inbox-event-batch.schema.json"
      responses:
        "202":
          description: Events accepted after deduplication
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, duplicates, item_ids]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  duplicates: { type: integer, minimum: 0 }
                  item_ids:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/items:
    get:
      tags: [Inbox]
      operationId: listInboxItems
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Unified Inbox page
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "./schemas/inbox-item.schema.json"
                  next_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/items/{itemId}:
    get:
      tags: [Inbox]
      operationId: getInboxItem
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      responses:
        "200":
          description: Unified Inbox item
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-item.schema.json"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/items/{itemId}:acknowledge:
    post:
      tags: [Inbox]
      operationId: acknowledgeInboxItem
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/inbox-acknowledge.schema.json"
      responses:
        "200":
          description: Exact digest revision acknowledged
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-item.schema.json"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/items/{itemId}/summary:
    post:
      tags: [Inbox]
      operationId: summarizeInboxItem
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      responses:
        "200":
          description: Item with refreshed AI summary
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-item.schema.json"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/items/{itemId}/draft:
    post:
      tags: [Inbox]
      operationId: createInboxDraft
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      responses:
        "200":
          description: Existing or generated reply draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-draft.schema.json"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/drafts/{draftId}:
    get:
      tags: [Inbox]
      operationId: getInboxDraft
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      responses:
        "200":
          description: Reply draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-draft.schema.json"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Inbox]
      operationId: updateInboxDraft
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/inbox-draft.schema.json#/$defs/InboxDraftPatch"
      responses:
        "200":
          description: User-edited reply draft
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-draft.schema.json"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/drafts/{draftId}/confirmation:
    post:
      tags: [Inbox]
      operationId: confirmInboxDraft
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      responses:
        "200":
          description: Short-lived one-time user confirmation
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-send.schema.json#/$defs/InboxConfirmation"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/inbox/drafts/{draftId}:send:
    post:
      tags: [Inbox]
      operationId: sendInboxDraft
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - name: draftId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/inbox-send.schema.json#/$defs/InboxSendRequest"
      responses:
        "200":
          description: Unified delivery result
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                $ref: "./schemas/inbox-send.schema.json#/$defs/InboxSendResult"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/inbox/sync-status:
    get:
      tags: [Inbox]
      operationId: getInboxSyncStatus
      security:
        - AppBearer: []
        - DemoTokenAuth: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ClientVersion"
        - $ref: "#/components/parameters/ContractVersion"
        - $ref: "#/components/parameters/DemoToken"
        - $ref: "#/components/parameters/AppSession"
      responses:
        "200":
          description: Per-account provider coverage and checkpoint state
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Contract-Version:
              $ref: "#/components/headers/ContractVersion"
            X-Hush-Data-Origin:
              $ref: "#/components/headers/DataOrigin"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/inbox-sync-status.schema.json"
        "409":
          $ref: "#/components/responses/Error"

  /v1/auth/gmail/start:
    get:
      tags: [Gmail]
      operationId: startGmailOAuth
      parameters:
        - name: return_to
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to Google OAuth

  /v1/auth/gmail/callback:
    get:
      tags: [Gmail]
      operationId: gmailOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to app or success page

  /v1/auth/gmail/status:
    get:
      tags: [Gmail]
      operationId: getGmailStatus
      responses:
        "200":
          description: Gmail connection status
          content:
            application/json:
              schema:
                type: object
                required: [connected]
                properties:
                  connected: { type: boolean }
                  account_label: { type: [string, "null"] }
                  scopes:
                    type: array
                    items: { type: string }

  /v1/auth/gmail/disconnect:
    post:
      tags: [Gmail]
      operationId: disconnectGmail
      responses:
        "204":
          description: Disconnected

  /v1/webhooks/photon:
    post:
      tags: [Photon]
      operationId: receivePhotonWebhook
      description: >
        Provider payload is isolated in the Photon adapter. Exact payload schema must be frozen
        after Day-1 verification; business code must not consume the raw provider shape.
      parameters:
        - name: X-Photon-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Accepted
        "401":
          description: Invalid signature

components:
  securitySchemes:
    AppBearer:
      type: http
      scheme: bearer
      description: Hush App session token. Cannot ingest connector events.
    ConnectorBearer:
      type: http
      scheme: bearer
      description: Connector Host token. Cannot query items or send drafts.
    DemoTokenAuth:
      type: apiKey
      in: header
      name: X-Hush-Demo-Token
      description: Available only when HUSH_DEMO_MODE=true.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      description: Must equal request_id in JSON request bodies.
      schema:
        type: string
        minLength: 1
    ClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ContractVersion:
      name: X-Contract-Version
      in: header
      required: true
      schema:
        type: string
        const: "1.0"
    RestContractVersion:
      name: X-Contract-Version
      in: header
      required: true
      description: >
        Rest evaluate and recommend support legacy fixed-Quest Contract 1.0
        and dynamic generated-task Contract 1.1.
      schema:
        type: string
        enum: ["1.0", "1.1"]
    DemoToken:
      name: X-Hush-Demo-Token
      in: header
      required: false
      description: Enables Sample Mode only when the server also has HUSH_DEMO_MODE=true.
      schema:
        type: string
        minLength: 8
    AppSession:
      name: X-Hush-App-Session
      in: header
      required: true
      description: >
        Per-launch high-entropy App session secret. Confirmation tokens are
        bound to its authenticated digest.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^(?!\s)(?!.*\s$)[^\x00-\x1F\x7F-\x9F]+$'

  headers:
    RequestId:
      schema:
        type: string
    ContractVersion:
      schema:
        type: string
        const: "1.0"
    RestContractVersion:
      schema:
        type: string
        enum: ["1.0", "1.1"]
    DataOrigin:
      schema:
        type: string
        enum: [real, mock, cached]

  responses:
    RestContractError:
      description: Versioned Rest operation error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        X-Contract-Version:
          $ref: "#/components/headers/RestContractVersion"
        X-Hush-Data-Origin:
          $ref: "#/components/headers/DataOrigin"
      content:
        application/json:
          schema:
            $ref: "./schemas/error-response.schema.json"
    Error:
      description: Error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        X-Contract-Version:
          $ref: "#/components/headers/ContractVersion"
        X-Hush-Data-Origin:
          $ref: "#/components/headers/DataOrigin"
      content:
        application/json:
          schema:
            $ref: "./schemas/error-response.schema.json"
