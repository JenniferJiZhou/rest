services:
  - type: web
    name: hush-server-staging
    runtime: node
    rootDir: .
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.15.9 --activate &&
      cd server &&
      pnpm install --frozen-lockfile &&
      pnpm build
    startCommand: cd server && pnpm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: HUSH_REST_DECISION_PROVIDER
        value: canned
      - key: HUSH_DEMO_MODE
        value: "false"
      - key: LOG_LEVEL
        value: info
